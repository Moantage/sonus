# SwiftLint config for the whole repo. CI runs it on Linux with --strict and the baseline below,
# so new code must be warning-free while pre-existing app code is grandfathered until it's
# refactored. Regenerate the baseline only when you intentionally clean up legacy code:
#   swiftlint lint --write-baseline .swiftlint-baseline.json
included:
  - ios/MP3Player
  - ios/SonusCore/Sources
  - ios/SonusCore/Tests
excluded:
  - "**/.build"

disabled_rules:
  - todo                    # TODOs are tracked in issues, not blocked by lint

opt_in_rules:
  - empty_count
  - first_where
  - contains_over_first_not_nil
  - sorted_first_last
  - redundant_nil_coalescing
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call
  - force_unwrapping

line_length:
  warning: 140
  error: 200
  ignores_urls: true
  ignores_comments: true

identifier_name:
  excluded: [id, i, x, y, db, to, ok, up]

type_body_length:
  warning: 300
  error: 500

file_length:
  warning: 500
  error: 1200

force_unwrapping:
  severity: warning
